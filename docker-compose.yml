version: '3'
services:
  app:
    build: .  # 使用当前目录下的 Dockerfile 构建 Spring Boot 应用镜像
    ports:
      - "8101:8101"  # 将容器的 8101 端口映射到主机的 8101 端口
    environment:
      - SPRING_PROFILES_ACTIVE=dev  # 设置 Spring Boot 的环境为 prod
    depends_on:
      - mysql  # 依赖 mysql 服务
    networks:
      - my-network  # 连接到自定义网络

  mysql:
    image: mysql:5.7  # 使用 MySQL 5.7 镜像
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # 设置 MySQL root 用户的密码
      MYSQL_DATABASE: delayoj  # 创建名为 delayoj 的数据库
    ports:
      - "3306:3306"  # 将容器的 3306 端口映射到主机的 3306 端口
    volumes:
      - mysql-data:/var/lib/mysql  # 持久化 MySQL 数据
      - ./sql:/docker-entrypoint-initdb.d  # 挂载 SQL 初始化脚本
    networks:
      - my-network  # 连接到自定义网络

volumes:
  mysql-data:  # 定义 MySQL 数据卷

networks:
  my-network:  # 定义自定义网络